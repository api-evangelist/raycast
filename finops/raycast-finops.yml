meters:
- name: pro_seats
  description: Number of individual Pro subscriptions, billed per seat per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - billingCycle
- name: teams_seats
  description: Number of Teams Pro seats, billed per user per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - team
  - billingCycle
- name: advanced_ai_seats
  description: Seats carrying the optional Advanced AI add-on, billed per seat per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - team
- name: ai_messages
  description: AI messages consumed against the per-plan included allowance (quota, not a separate charge).
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track active seat counts per tier (Free / Pro / Teams) and Advanced AI add-on attach rate from the Raycast billing console.
- name: Allocation
  description: Map Teams seats to departments or cost centers; tag the AI add-on separately to see its incremental cost.
- name: Optimization
  description: Right-size seats - downgrade inactive Pro users to Free, reserve the Advanced AI add-on for users who need frontier models, and prefer annual billing for the per-seat discount.
- name: Accountability
  description: Assign a team owner to review seat counts and add-on attach monthly against budget.
