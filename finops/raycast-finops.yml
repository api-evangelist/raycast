description: >-
  FinOps view of Raycast spend. Raycast is billed as a per-seat SaaS
  subscription, not usage-metered API consumption. Cost drivers are the count
  of Pro seats, Teams seats, and Advanced AI add-on seats. The @raycast/api SDK
  and Store publishing are free, so there is no per-call inference or API
  charge to allocate - spend is a function of how many users are licensed at
  each tier and whether they carry the AI add-on.
notes: >-
  Per-seat list prices captured from raycast.com/pricing on 2026-06-20 and are
  subject to change; verify during reconciliation. Because billing is seat-based
  rather than usage-based, optimization focuses on right-sizing seat counts and
  tiers, not on token or request reduction.
